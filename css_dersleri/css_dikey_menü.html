<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        ul {
            list-style-type: none;
            width: 40%;
        }

        ul>li {
            padding: 10px;
            background-color: #3f3f3f;
            margin-left: -30px;
        }

        ul>li:hover {
            background-color: red;
            transition: 0.5s;
        }

        ul>li>a {
            text-decoration: none;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
        i{
            padding-right: 15px;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#"><i class="fa-sharp-duotone fa-solid fa-house"></i>Home</a></li>
        <li><a href="#"><i class="fa-sharp-duotone fa-solid fa-newspaper"></i>News</a></li>
        <li><a href="#"><i class="fa-sharp-duotone fa-solid fa-address-card"></i>Contact</a></li>
        <li><a href="#"><i class="fa-sharp-duotone fa-solid fa-user"></i>About</a></li>
    </ul>

</html>

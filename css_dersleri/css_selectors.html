        /* div>p:last-child{color: red;} parenti div olan p'nin son çoçuğuna uygula */
        /* div>p:nth-child(3){color: red;} p'nin hangi çocuguna uygulanmasını istersen */ 
        /* div>nav>a:nth-child(3){color: red;} */
        /* .div2>ul>li:nth-child(2){color: red;} */
    </style>

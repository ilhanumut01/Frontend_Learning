<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML ÖĞRENMEK</title>
                                                   <!-- style == css komutları(<head>) -->
                                                   <!-- htmlde class yazarak çağırabiliriz -->
    <style>               
        .divOzellik{
            width: 100%;
            height: 300px;
            background-color: gold;
            text-align: center;
            margin-bottom: 10px;
        }
        .divOzellilk2{
            width: 100%;
            height: 300px;
            background-color: crimson;
        }
    </style>
</head>
<body>

    <div class="divOzellik">
        <h3>GALATASARAY THE BEST</h3>
        <p>Bu bir örnek yazıdır.</p>
    </div>

    <div class="divOzellilk2">

    </div>
</body>
</html>

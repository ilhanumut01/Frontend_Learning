<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML ÖĞRENMEK</title>
</head>
<body>
     <h3>İÇECEKLER</h3> 
    <ul>                                              <!-- ul == sırasız liste -->
      <li>kahve</li>
      <li>çay</li>
      <li>oralet</li>
    </ul>
                            <!-- type=""  <ol> kullanırken nasıl sıralayabileceğimizi yapabliriz -->
    <ol type="a">                                     <!-- ol == sıralı liste -->  
      <li>kahve</li>
      <li>çay</li>
      <li>oralet</li>
    </ol> 
</body>
</html>

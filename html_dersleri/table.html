<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML ÖĞRENMEK</title>                    
</head>                                                        <!-- colspan == kolonları birleştirir -->
<body>                                                         <!-- rowspan == satırları birleştirir -->
  <table border="1">                           <!-- tablonun en dış kısmı (border sınır belirtmek için) -->
    <tr>                                       <!-- tablonun satırları -->
      <th colspan="3">Kişisel Bilgiler</th>    <!-- başlıklerı belirtmek için kullanılır(th) -->
    </tr>

    <tr>
      <th rowspan="2">Soyisimler</th>
      <td>İlhan</td>                           <!-- satırlarının içerisindeki veriler(td) -->
      <td>22</td>
    </tr>

    <tr>
      <td>İlhan</td>
      <td>20</td>
    </tr>
    
  </table>
</body>
</html>
